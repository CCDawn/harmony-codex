<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' resource:; style-src 'unsafe-inline'; media-src blob:; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>助手的电脑</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#24342e;background:#f3f5f2;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:14px}body.dark{color:#e0e7df;background:#151b18;color-scheme:dark}button,input{font:inherit}button{border:1px solid #bbc8bd;border-radius:12px;padding:10px 14px;min-height:44px;background:transparent;color:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #75ac92;outline-offset:2px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 18px}.head span{font-size:12px;color:#6b8172}.screen{position:relative;background:#18241d;border-radius:14px;overflow:hidden;height:min(64vh,720px);min-height:240px}video{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}.cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;color:#dce9df;text-align:center;pointer-events:none}.cover strong{font-size:19px}.cover span{font-size:13px;margin-top:8px}.tools{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0}.primary{background:#245d46;color:#fff;border-color:#245d46}.note{font-size:13px;color:#6b8172;min-height:40px}#keyboardPanel{padding:10px 0}#keyboardPanel input{width:100%;padding:12px;border:1px solid #bbc8bd;border-radius:10px;background:transparent;color:inherit}.keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}[hidden]{display:none!important}.small{font-size:12px;color:#6b8172}#status{font-size:16px}@media(min-width:900px){body{max-width:1150px;margin:auto}}
</style></head><body>
<div class="head"><strong id="status" role="status">未连接</strong><span id="owner">输入已停用</span></div>
<div class="screen"><video id="video" autoplay muted playsinline tabindex="0" aria-label="助手云电脑画面"></video><div id="cover" class="cover"><strong id="coverTitle">正在连接云电脑</strong><span id="coverHint">等待画面与数据通道就绪</span></div></div>
<div class="tools"><button id="control" class="primary" disabled>接管电脑</button><button id="scrollMode" disabled>滚动</button><button id="keyboard" disabled>键盘输入</button><button id="reconnect" hidden>重新连接</button></div>
<div id="keyboardPanel" hidden><input id="textInput" autocomplete="off" aria-label="远程键盘输入" placeholder="输入文字，再点发送" disabled><div class="keys"><button id="sendText" disabled>发送文字</button><button data-key="Return" disabled>回车</button><button data-key="BackSpace" disabled>退格</button><button data-key="Escape" disabled>Esc</button><button data-key="Tab" disabled>Tab</button></div></div>
<p id="hint" class="note">仅观看不会操作电脑。</p>
<p class="small">离开页面或锁屏会停止输入并请求归还控制。语音通话由 App 独立保持。</p>
<script src="protocol.js"></script><script src="viewer.js"></script></body></html>
